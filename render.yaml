# Render Blueprint: two web services from this repo, on Render's free *.onrender.com addresses.
# Secrets use `sync: false`: Render asks for their values when you apply the Blueprint; they are never stored here.
#
# Each service is served at https://<name>.onrender.com when that name is free on Render; otherwise Render adds a
# suffix. After the first deploy, check both URLs in the dashboard and update API_URL / CORS_ORIGIN_REGEX below if
# they differ.
#
# Custom domain later (once kilobite.tech is registered): add to the API service
#     domains: [api.kilobite.tech]
# and to the web service
#     domains: [kilobite.tech, www.kilobite.tech]
# then point NEXT_PUBLIC_API_URL / BACKEND_URL at https://api.kilobite.tech and redeploy the web service.
services:
  # FastAPI: targets, knowledge base, region lookup, planner.
  - type: web
    name: kilobite-planner-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: API_KEY # Groq
        sync: false
      - key: GEMMA_API_KEY # Google AI Studio
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: MONGODB_URI # Atlas knowledge graph (X.509 auth)
        sync: false
      # Upload the Atlas certificate as a Secret File named mongodb-x509.pem (Environment → Secret Files).
      - key: MONGODB_CERT_PATH
        value: /etc/secrets/mongodb-x509.pem
      - key: ENABLE_LOCAL_MODELS
        value: "false"
      - key: CORS_ORIGINS
        value: https://kilobite.tech,https://www.kilobite.tech
      # The web service's onrender.com address (also replaces the localhost-only default).
      - key: CORS_ORIGIN_REGEX
        value: ^https://kilobite-planner-web(-[a-z0-9]+)?\.onrender\.com$

  # Next.js UI + Mastra agent routes.
  - type: web
    name: kilobite-planner-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_KEY # Groq, for the agents
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Browser -> API (baked in at build time, so redeploy after changing) and agent routes -> API.
      - key: NEXT_PUBLIC_API_URL
        value: https://kilobite-planner-api.onrender.com
      - key: BACKEND_URL
        value: https://kilobite-planner-api.onrender.com
